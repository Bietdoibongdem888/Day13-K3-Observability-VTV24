alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 2m
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#alert-2
  - name: high_daily_cost
    severity: warning
    condition: cost_usd > 2.5 for 1h
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#alert-3
