alerts:
  - name: high_latency_p95
    severity: critical
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: oncall-team
    runbook: docs/alerts.md#high-latency
  - name: error_rate_spike
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: oncall-team
    runbook: docs/alerts.md#error-spike
  - name: cost_overrun
    severity: warning
    condition: total_cost_usd > 2.5 for 15m
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#cost-overrun
